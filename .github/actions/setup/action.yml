name: Setup
description: >-
  Parse .github/ci-settings.yml, set up Node via Volta, cache npm,
  and install dependencies with the project's required flags.

outputs:
  node-version:
    description: Node version (clean, no leading "v") as resolved from ci-settings.yml.
    value: ${{ steps.versions.outputs.node_version }}

runs:
  using: composite
  steps:
    - name: Parse CI settings
      id: settings-parser
      uses: christian-ci/action-yaml-github-output@v2
      with:
        file_path: ./.github/ci-settings.yml

    - name: Set up Node via Volta
      uses: volta-cli/action@v5
      with:
        # NOTE: `package-json-path` intentionally omitted. With it, volta-cli
        # rewrites the package.json to pin `volta.node`, leaving uncommitted
        # changes that `@semantic-release/git` then bundles into release
        # commits. ci-settings.yml is already the single source of truth for
        # the Node version.
        node-version: ${{ steps.settings-parser.outputs.node-version }}

    - name: Print runtime versions
      id: versions
      shell: bash
      run: |
        echo "Node: $(node --version)"
        echo "NPM:  $(npm --version)"
        node_ver=$(node --version)
        echo "node_version=${node_ver#v}" >> "$GITHUB_OUTPUT"

    - name: Cache npm
      uses: actions/cache@v5
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ steps.versions.outputs.node_version }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ steps.versions.outputs.node_version }}-

    - name: Install dependencies
      shell: bash
      run: npm ci --legacy-peer-deps
