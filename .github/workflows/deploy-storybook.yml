name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse additional settings
        id: settings-parser
        uses: christian-ci/action-yaml-github-output@v2
        with:
          file_path: './.github/ci-settings.yml'

      - name: Setup Node
        uses: volta-cli/action@v4
        with:
          node-version: "${{ steps.settings-parser.outputs.node-version }}"
          package-json-path: "${{ github.workspace }}/package.json"

      - name: Print runtime versions
        id: versions
        run: |
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          node_ver=$(node --version)
          node_ver_clean=${node_ver#v}
          echo "node_version=$node_ver_clean" >> $GITHUB_OUTPUT

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ steps.versions.outputs.node_version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.versions.outputs.node_version }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Storybook
        run: npm run build-storybook

      - name: Check Storybook output
        run: |
          echo "Listing current directory..."
          ls -R .
          echo "Listing storybook-static..."
          ls -R storybook-static || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
          publish_branch: gh-pages
