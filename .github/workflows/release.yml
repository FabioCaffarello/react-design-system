name: Release

on:
  push:
    branches: [main, beta, alpha]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Semantic Release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v6
        with:
          # semantic-release 25: its release-notes-generator (v14 family)
          # consumes the new conventional-changelog preset shape
          # ({commits, parser, writer, whatBump}). Our release.config.cjs uses
          # preset "conventionalcommits", resolved from THIS repo's
          # node_modules — conventional-changelog-conventionalcommits jumped
          # 7.0.2 -> 9.3.1 (new shape) via the @commitlint/config-conventional
          # 21 bump (#170), which broke semantic-release 23's generator (v13,
          # old shape): writerOpts came back empty, the writer fell back to its
          # default transform, and every release failed with
          # "RangeError: Invalid time value" (issue #206). 25 is also the
          # major the action's own lockfile ships, so the runtime
          # npm-downgrade mutation goes away.
          semantic_version: 25
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.semantic-release.outputs.new_release_published }}" = "true" ]; then
            echo "New release published: ${{ steps.semantic-release.outputs.new_release_version }}"
            echo "Changelog updated and package published to npm."
          else
            echo "No new release published."
          fi
